name: Profile assets

on:
  schedule:
    - cron: "17 1 * * *"   # daily, 06:47 IST
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

jobs:
  profile-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build contributions heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/build_heatmap.py

      - name: Build stats, streak and language cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/build_stats.py

      - name: Commit if changed
        run: |
          # commit as you, so the only contributor on the repo is you
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add assets/heatmap.svg assets/stats.svg assets/streak.svg assets/languages.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile stats"
          git pull --rebase origin main
          git push
