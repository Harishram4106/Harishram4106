<svg xmlns="http://www.w3.org/2000/svg" width="480" height="248" viewBox="0 0 480 248" role="img" aria-label="Contribution streak">
<title>Contribution streak</title>
<style>
  .t { font-family: 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono','Courier New',monospace; fill: #e6edf3; }
  .h { font-size: 17px; font-weight: 800; fill: #d2ff4d; }
  .k { font-size: 14px; fill: #9fc9a3; }
  .v { font-size: 14px; font-weight: 700; fill: #e6edf3; }
  .big { font-size: 30px; font-weight: 800; fill: #e6edf3; }
  .lbl { font-size: 13px; font-weight: 700; fill: #d2ff4d; }
  .sub { font-size: 11px; fill: #9fc9a3; }
  .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }
</style>
<rect x="1" y="1" width="478" height="246" rx="10" fill="#060b07" stroke="#2f7a3a" stroke-width="1.5"/>
<text x="24" y="38" class="t h">&gt; streak --watch</text>
<g class="fade" style="animation-delay:0.00s"><text x="90" y="129" text-anchor="middle" class="t big">138</text><text x="90" y="188" text-anchor="middle" class="t lbl">Contributions</text><text x="90" y="208" text-anchor="middle" class="t sub">Sep 19, 2024 – present</text></g>
<circle cx="240" cy="118" r="42" fill="none" stroke="#d2ff4d" stroke-width="5"/>
<line x1="165" y1="70" x2="165" y2="210" stroke="#2f7a3a"/>
<g class="fade" style="animation-delay:0.15s"><text x="240" y="129" text-anchor="middle" class="t big">8</text><text x="240" y="188" text-anchor="middle" class="t lbl">Current streak</text><text x="240" y="208" text-anchor="middle" class="t sub">Nov 5 – Nov 12</text></g>
<line x1="315" y1="70" x2="315" y2="210" stroke="#2f7a3a"/>
<g class="fade" style="animation-delay:0.30s"><text x="390" y="129" text-anchor="middle" class="t big">8</text><text x="390" y="188" text-anchor="middle" class="t lbl">Longest streak</text><text x="390" y="208" text-anchor="middle" class="t sub">Nov 5 – Nov 12</text></g>
</svg>
